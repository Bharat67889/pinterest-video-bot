name: Pinterest Bot

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install

      - run: npx playwright install

      - run: node upload.js

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: "*.png"
